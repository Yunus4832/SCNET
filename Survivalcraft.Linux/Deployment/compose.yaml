services:
  game-server:
    image: __SCNET_IMAGE__
    restart: unless-stopped
    working_dir: /app
    network_mode: host
    volumes:
      - "${SCNET_INSTANCES_DIR:-./Instances}:/app/Instances"
    command:
      - --instance
      - ${SCNET_INSTANCE:-server}
      - --server
      - --session
      - ${SCNET_SESSION:-survival}
      - --world
      - ${SCNET_WORLD:-World}
      - --seed
      - ${SCNET_SEED:-123456}
      - --game-mode
      - ${SCNET_GAME_MODE:-Survival}
      - --server-port
      - ${SCNET_SERVER_PORT:-28887}
      - "${SCNET_HTTP_COMMAND_SWITCH:---no-http-command}"
      - --http-command-port
      - "${SCNET_HTTP_COMMAND_PORT:-28889}"
      - --http-command-access-token
      - "${SCNET_HTTP_COMMAND_ACCESS_TOKEN:-}"
      - --no-broadcast
      - --save
      - --p2p
      - "${SCNET_P2P:-false}"
      - --rendezvous
      - "${SCNET_RENDEZVOUS:-}"
      - --room-name
      - "${SCNET_ROOM_NAME:-World}"
      - --room-description
      - "${SCNET_ROOM_DESCRIPTION:-}"
      - --room-public
      - "${SCNET_ROOM_PUBLIC:-false}"

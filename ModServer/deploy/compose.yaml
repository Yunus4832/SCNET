name: scnet-mod-server

services:
  mod_server:
    container_name: scnet-mod-server
    image: ${MOD_SERVER_IMAGE:-registry.cn-hangzhou.aliyuncs.com/yunus4832/mod_server}:${MOD_SERVER_TAG:-0.0.0.1}
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ModServer__DataDirectory: /data
      ModServer__UploadApiKeys__0: local-dev-upload-key
    ports:
      - "9527:8080"
    volumes:
      - mod_server_data:/data
    restart: unless-stopped

volumes:
  mod_server_data:
